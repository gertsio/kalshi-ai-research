<svg width="2400" height="1350" viewBox="0 0 2400 1350" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Kalshi AI Research app cover</title>
  <desc id="desc">A clean product screenshot-style cover for Kalshi AI Research showing a market research input form and example market cards.</desc>
  <rect width="2400" height="1350" fill="#ffffff"/>
  <line y1="104" x2="2400" y2="104" stroke="#e5e5e5"/>

  <g transform="translate(402 32)">
    <rect width="54" height="54" rx="10" fill="#0f0f0f"/>
    <path d="M18 14v27M36 14 18 28l20 13" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="68" y="39" fill="#121212" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">Kalshi AI Research</text>
  </g>

  <g transform="translate(644 217)" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">
    <text x="556" y="72" fill="#111111" font-size="86" font-weight="800" letter-spacing="-3">Research a Kalshi market in</text>
    <text x="556" y="153" fill="#119b85" font-size="86" font-weight="800" letter-spacing="-3">seconds<tspan fill="#111111">.</tspan></text>
    <text x="556" y="240" fill="#666666" font-size="28" letter-spacing="1">Paste a market URL or ticker. Six agents read the rules, gather evidence,</text>
    <text x="556" y="286" fill="#666666" font-size="28" letter-spacing="1">and return a research memo.</text>
  </g>

  <g transform="translate(644 565)">
    <rect width="925" height="78" rx="8" fill="#ffffff" stroke="#dddddd" stroke-width="2"/>
    <text x="18" y="49" fill="#666666" font-family="Arial, Helvetica, sans-serif" font-size="26">Paste a Kalshi market URL or ticker</text>
    <rect x="942" width="186" height="78" rx="7" fill="#8ecdbf"/>
    <text x="1035" y="49" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Research</text>
  </g>

  <g transform="translate(644 717)" font-family="Arial, Helvetica, sans-serif">
    <text y="15" fill="#555555" font-size="21" font-weight="700">Examples</text>
    <g transform="translate(0 43)">
      <rect width="365" height="110" rx="8" fill="#ffffff" stroke="#dedede" stroke-width="2"/>
      <text x="22" y="47" fill="#111111" font-size="26">Example economic release</text>
      <text x="22" y="81" fill="#666666" font-size="21" font-weight="700">KXEXAMPLE-26MAY03-DEMO</text>
    </g>
    <g transform="translate(381 43)">
      <rect width="365" height="143" rx="8" fill="#ffffff" stroke="#dedede" stroke-width="2"/>
      <text x="22" y="47" fill="#111111" font-size="26">Fed rate decision</text>
      <text x="22" y="81" fill="#111111" font-size="26">(placeholder)</text>
      <text x="22" y="117" fill="#666666" font-size="21" font-weight="700">KXFEDRATE-DEC26</text>
    </g>
    <g transform="translate(762 43)">
      <rect width="365" height="143" rx="8" fill="#ffffff" stroke="#dedede" stroke-width="2"/>
      <text x="22" y="47" fill="#111111" font-size="26">Monthly jobs print</text>
      <text x="22" y="81" fill="#111111" font-size="26">(placeholder)</text>
      <text x="22" y="117" fill="#666666" font-size="21" font-weight="700">KXJOBS-26JUN-PLACEHOLDER</text>
    </g>
  </g>

  <g transform="translate(402 1142)" font-family="Arial, Helvetica, sans-serif">
    <rect width="1596" height="108" rx="8" fill="#fafafa" stroke="#e7e7e7" stroke-width="2"/>
    <text x="28" y="46" fill="#222222" font-size="22" font-weight="700">Disclosure.</text>
    <text x="146" y="46" fill="#666666" font-size="22">Research-only analysis. Output describes a probability estimate from agent research compared with Kalshi's market-implied probability. It is not</text>
    <text x="28" y="82" fill="#666666" font-size="22">financial advice and is not a recommendation to place, buy, or sell any contract.</text>
  </g>

  <line x1="402" y1="1265" x2="1998" y2="1265" stroke="#efefef"/>
  <g transform="translate(402 1325)" font-family="Arial, Helvetica, sans-serif">
    <rect width="35" height="35" rx="7" fill="#0f0f0f"/>
    <path d="M12 10v17M24 10 12 18l13 9" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="48" y="26" fill="#777777" font-size="22">© 2026 Kalshi AI Research</text>
  </g>
</svg>
